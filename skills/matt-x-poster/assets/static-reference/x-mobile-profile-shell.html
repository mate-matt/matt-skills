<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=430, initial-scale=1" />
    <title>X Mobile Profile Structural Reference</title>
    <style>
      body {
        margin: 0;
        background: #f7f9f9;
        color: #0f1419;
        font-family: Arial, Helvetica, sans-serif;
      }
      .phone {
        width: 430px;
        min-height: 900px;
        background: #fff;
      }
      .status {
        height: 42px;
        padding: 12px 22px 0;
        display: flex;
        justify-content: space-between;
        font-weight: 800;
        font-size: 18px;
      }
      .hero {
        height: 154px;
        background: linear-gradient(135deg, #a8c7df, #24435a 70%, #10202c);
        position: relative;
      }
      .top-actions {
        position: absolute;
        inset: 54px 18px auto 18px;
        display: flex;
        justify-content: space-between;
      }
      .round {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: rgba(15, 20, 25, 0.72);
      }
      .profile {
        padding: 0 14px 10px;
        border-bottom: 1px solid #eff3f4;
      }
      .avatar {
        width: 88px;
        height: 88px;
        margin-top: -44px;
        border-radius: 999px;
        border: 4px solid #fff;
        background: #d7dce0;
      }
      .name {
        margin-top: 18px;
        font-size: 31px;
        font-weight: 900;
        line-height: 1;
      }
      .handle,
      .meta {
        margin-top: 8px;
        color: #536471;
        font-size: 20px;
        font-weight: 700;
      }
      .bio {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.35;
      }
      .counts {
        margin-top: 18px;
        display: flex;
        gap: 16px;
        font-size: 20px;
        color: #536471;
        font-weight: 700;
      }
      .counts b {
        color: #0f1419;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        height: 54px;
        border-bottom: 1px solid #eff3f4;
      }
      .tab {
        display: grid;
        place-items: center;
        color: #536471;
        font-weight: 900;
        font-size: 19px;
        position: relative;
      }
      .tab.active {
        color: #0f1419;
      }
      .tab.active::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 0;
        height: 4px;
        border-radius: 999px;
        background: #1d9bf0;
      }
      .post-row {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 8px;
        padding: 16px 12px;
        border-bottom: 1px solid #eff3f4;
      }
      .small-avatar {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: #d7dce0;
      }
      .line {
        height: 18px;
        margin: 7px 0;
        border-radius: 999px;
        background: #dce3e8;
      }
      .media {
        margin-top: 12px;
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        border: 1px solid #cfd9de;
        background: #f2f5f7;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="status"><span>16:08</span><span>5G</span></div>
      <section class="hero">
        <div class="top-actions"><span class="round"></span><span class="round"></span></div>
      </section>
      <section class="profile">
        <div class="avatar"></div>
        <div class="name">Display Name</div>
        <div class="handle">@handle</div>
        <div class="bio">Profile bio line one<br />Profile bio line two</div>
        <div class="meta">Location / Joined date</div>
        <div class="counts"><span><b>000</b> Following</span><span><b>000</b> Followers</span></div>
      </section>
      <nav class="tabs">
        <div class="tab active">Posts</div>
        <div class="tab">Replies</div>
        <div class="tab">Highlights</div>
        <div class="tab">Videos</div>
        <div class="tab">Photos</div>
      </nav>
      <article class="post-row">
        <div class="small-avatar"></div>
        <div>
          <div class="line" style="width: 78%"></div>
          <div class="line" style="width: 92%"></div>
          <div class="line" style="width: 68%"></div>
          <div class="media"></div>
        </div>
      </article>
    </main>
  </body>
</html>
